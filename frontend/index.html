<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Dark only in V1: without this the browser chrome stays white above a
         black page on a phone. -->
    <meta name="theme-color" content="#060A08" />
    <title>Wallet</title>
    <meta name="description" content="I tuoi conti, le tue spese, il tuo patrimonio." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- ⚠️ On iOS this meta is what actually launches the app full screen; the
         manifest's `display` alone does nothing there. And the status bar stays
         `default`: `black-translucent` would run the page under the clock. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wallet" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Substitutions declared in DESIGN.md: no font files were provided.
         Space Grotesk carries display and every number, Instrument Sans the text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&family=Space+Grotesk:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
